<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <title>Premium Cafe Badge — Logo Engine V2 Template 001</title>
  <desc>Editable vector badge template. Replace elements marked data-logo.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d19"/>
      <stop offset=".5" stop-color="#16483c"/>
      <stop offset="1" stop-color="#08231e"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c6416"/>
      <stop offset=".22" stop-color="#f8dc82"/>
      <stop offset=".5" stop-color="#fff0ad"/>
      <stop offset=".72" stop-color="#d2a63b"/>
      <stop offset="1" stop-color="#76500f"/>
    </linearGradient>

    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".55" stop-color="#f3e4bd"/>
      <stop offset="1" stop-color="#d8bd7b"/>
    </linearGradient>

    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b4b25"/>
      <stop offset=".45" stop-color="#542512"/>
      <stop offset="1" stop-color="#291107"/>
    </linearGradient>

    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#477b47"/>
      <stop offset=".45" stop-color="#1e542f"/>
      <stop offset="1" stop-color="#0a2c1d"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".38"/>
    </filter>

    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/>
    </filter>

    <!-- Text paths -->
    <path id="upperArc" d="M 230 440 A 375 375 0 0 1 970 440"/>
    <path id="lowerArc" d="M 280 790 A 330 330 0 0 0 920 790"/>

    <!-- Decorative leaf symbol -->
    <g id="leafShape">
      <path d="M0 0 C18-32 52-44 76-34 C65-7 40 15 0 0Z"
            fill="url(#leaf)" stroke="#09261b" stroke-width="3"/>
      <path d="M5-2 C28-10 48-22 68-31" fill="none"
            stroke="#b9d58a" stroke-width="2" opacity=".8"/>
    </g>

    <!-- Coffee bean -->
    <g id="bean">
      <ellipse cx="0" cy="0" rx="25" ry="15" fill="url(#coffee)"
               stroke="#241006" stroke-width="4"/>
      <path d="M-14-9 C-4-2 -4 5 -14 10 C1 8 8 1 13-9"
            fill="none" stroke="#d38b48" stroke-width="3" opacity=".75"/>
    </g>
  </defs>

  <!-- =========================
       BADGE FOUNDATION
       ========================= -->
  <g id="badge">
    <circle cx="600" cy="600" r="560" fill="#050d0b"
            stroke="#2b1a08" stroke-width="5"/>

    <circle cx="600" cy="600" r="548" fill="url(#bg)"
            stroke="url(#gold)" stroke-width="16"/>

    <circle cx="600" cy="600" r="515" fill="none"
            stroke="#f7e7b1" stroke-width="4"/>

    <circle cx="600" cy="600" r="495" fill="none"
            stroke="url(#gold)" stroke-width="7"/>

    <circle cx="600" cy="600" r="465" fill="#0b2d26"
            stroke="#f8e8b5" stroke-width="3"/>

    <circle cx="600" cy="600" r="438" fill="#29170d"
            stroke="url(#gold)" stroke-width="7"/>

    <!-- Inner engraved lines -->
    <circle cx="600" cy="600" r="421" fill="none"
            stroke="#8d6a2a" stroke-width="2" opacity=".8"/>
    <circle cx="600" cy="600" r="408" fill="none"
            stroke="#f0d88d" stroke-width="2" opacity=".7"/>
  </g>

  <!-- =========================
       TOP TYPOGRAPHY
       ========================= -->
  <g id="topText">
    <text fill="#fff6d5" font-family="Georgia, 'Times New Roman', serif"
          font-size="54" font-weight="700" letter-spacing="13"
          text-anchor="middle" data-logo="category">
      <textPath href="#upperArc" startOffset="50%">PREMIUM COFFEE</textPath>
    </text>

    <circle cx="226" cy="421" r="8" fill="url(#gold)"/>
    <circle cx="974" cy="421" r="8" fill="url(#gold)"/>
  </g>

  <!-- =========================
       BOTANICAL ORNAMENT
       ========================= -->
  <g id="botanical" data-logo="accent" filter="url(#smallShadow)">
    <path d="M205 565 C135 485 150 390 230 330"
          fill="none" stroke="url(#gold)" stroke-width="10"
          stroke-linecap="round"/>
    <path d="M995 565 C1065 485 1050 390 970 330"
          fill="none" stroke="url(#gold)" stroke-width="10"
          stroke-linecap="round"/>

    <use href="#leafShape" transform="translate(196 495) rotate(-82) scale(.72)"/>
    <use href="#leafShape" transform="translate(177 448) rotate(-54) scale(.68)"/>
    <use href="#leafShape" transform="translate(180 395) rotate(-30) scale(.62)"/>
    <use href="#leafShape" transform="translate(1004 495) rotate(-98) scale(.72)"/>
    <use href="#leafShape" transform="translate(1023 448) rotate(-126) scale(.68)"/>
    <use href="#leafShape" transform="translate(1020 395) rotate(-150) scale(.62)"/>

    <!-- Coffee cherries -->
    <g fill="#a92e22" stroke="#5b130e" stroke-width="4">
      <circle cx="215" cy="505" r="18"/>
      <circle cx="252" cy="527" r="18"/>
      <circle cx="985" cy="505" r="18"/>
      <circle cx="948" cy="527" r="18"/>
    </g>
  </g>

  <!-- =========================
       CENTRAL COFFEE ILLUSTRATION
       ========================= -->
  <g id="coffeeIllustration" filter="url(#softShadow)">
    <!-- wood inset -->
    <ellipse cx="600" cy="545" rx="350" ry="265"
             fill="#3b1c0e" stroke="url(#gold)" stroke-width="5"/>
    <ellipse cx="600" cy="545" rx="327" ry="242"
             fill="#5a2b13" stroke="#1b0b05" stroke-width="3"/>

    <!-- engraved radial lines -->
    <g stroke="#9b5c31" stroke-width="3" opacity=".35">
      <path d="M600 305 L600 790"/>
      <path d="M450 335 L735 755"/>
      <path d="M350 440 L850 650"/>
      <path d="M350 650 L850 440"/>
      <path d="M465 755 L735 335"/>
    </g>

    <!-- saucer -->
    <ellipse cx="600" cy="594" rx="250" ry="68"
             fill="url(#cream)" stroke="#5d371d" stroke-width="8"/>
    <ellipse cx="600" cy="580" rx="202" ry="48"
             fill="#fffdf4" stroke="#b88938" stroke-width="5"/>

    <!-- cup body -->
    <path d="M455 430
             C455 560 492 620 600 630
             C708 620 745 560 745 430
             Z"
          fill="url(#cream)" stroke="#5d371d" stroke-width="9"/>

    <!-- cup top -->
    <ellipse cx="600" cy="430" rx="150" ry="65"
             fill="#fffdf4" stroke="#5d371d" stroke-width="9"/>
    <ellipse cx="600" cy="432" rx="126" ry="48"
             fill="url(#coffee)" stroke="#b8792f" stroke-width="5"/>

    <!-- latte art -->
    <path d="M600 470
             C545 445 552 415 600 433
             C648 415 655 445 600 470
             M600 458
             C578 438 584 426 600 435
             C616 426 622 438 600 458
             M600 447
             C590 436 594 430 600 434
             C606 430 610 436 600 447"
          fill="none" stroke="#f8e7bb" stroke-width="8"
          stroke-linecap="round"/>

    <!-- handle -->
    <path d="M735 470 C850 425 850 575 735 545"
          fill="none" stroke="#5d371d" stroke-width="38"/>
    <path d="M738 470 C815 448 815 548 738 532"
          fill="none" stroke="#fff9e8" stroke-width="22"/>

    <!-- steam -->
    <g fill="none" stroke="url(#cream)" stroke-width="13"
       stroke-linecap="round">
      <path d="M545 350 C515 305 570 280 545 225"/>
      <path d="M600 350 C565 300 625 275 600 210"/>
      <path d="M655 350 C625 305 680 280 655 230"/>
    </g>

    <!-- spoon -->
    <ellipse cx="790" cy="605" rx="18" ry="50"
             fill="url(#gold)" stroke="#5d371d" stroke-width="5"
             transform="rotate(-48 790 605)"/>
    <path d="M748 635 L800 685" stroke="#d0a044" stroke-width="12"
          stroke-linecap="round"/>

    <!-- beans -->
    <g>
      <use href="#bean" transform="translate(425 598) rotate(-22)"/>
      <use href="#bean" transform="translate(470 620) rotate(18)"/>
      <use href="#bean" transform="translate(725 620) rotate(-16)"/>
      <use href="#bean" transform="translate(770 598) rotate(24)"/>
    </g>

    <!-- leaves behind cup -->
    <g opacity=".98">
      <use href="#leafShape" transform="translate(425 500) rotate(-145) scale(1.05)"/>
      <use href="#leafShape" transform="translate(395 545) rotate(-170) scale(.9)"/>
      <use href="#leafShape" transform="translate(775 500) rotate(-35) scale(1.05)"/>
      <use href="#leafShape" transform="translate(805 545) rotate(-10) scale(.9)"/>
    </g>
  </g>

  <!-- =========================
       MAIN NAME RIBBON
       ========================= -->
  <g id="nameRibbon" filter="url(#softShadow)">
    <!-- tails -->
    <path d="M120 595 L205 535 L260 585 L190 650 Z"
          fill="url(#gold)" stroke="#5c3a0d" stroke-width="5"/>
    <path d="M1080 595 L995 535 L940 585 L1010 650 Z"
          fill="url(#gold)" stroke="#5c3a0d" stroke-width="5"/>

    <!-- ribbon -->
    <path d="M135 545
             Q150 525 180 525
             L1020 525
             Q1050 525 1065 545
             L1085 600
             L1065 655
             Q1050 675 1020 675
             L180 675
             Q150 675 135 655
             L115 600 Z"
          fill="url(#bg)" stroke="url(#gold)" stroke-width="11"/>

    <path d="M150 553
             Q165 542 190 542
             L1010 542
             Q1035 542 1050 553
             L1065 600
             L1050 647
             Q1035 658 1010 658
             L190 658
             Q165 658 150 647
             L135 600 Z"
          fill="none" stroke="#f7e7b1" stroke-width="3"/>

    <!-- rivets -->
    <circle cx="175" cy="600" r="17" fill="url(#gold)" stroke="#6d4a12" stroke-width="4"/>
    <circle cx="1025" cy="600" r="17" fill="url(#gold)" stroke="#6d4a12" stroke-width="4"/>

    <!-- EDITABLE -->
    <text data-logo="name"
          x="600" y="625"
          text-anchor="middle"
          fill="#fff8dc"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="82"
          font-weight="900"
          letter-spacing="5"
          textLength="780"
          lengthAdjust="spacingAndGlyphs">BRAND NAME</text>
  </g>

  <!-- =========================
       SLOGAN PLATE
       ========================= -->
  <g id="sloganPlate" filter="url(#smallShadow)">
    <path d="M315 685 Q600 650 885 685 L835 755 Q600 780 365 755 Z"
          fill="url(#cream)" stroke="url(#gold)" stroke-width="8"/>
    <path d="M350 696 Q600 670 850 696"
          fill="none" stroke="#6d4a12" stroke-width="3"/>

    <circle cx="365" cy="718" r="8" fill="#0d3b31"/>
    <circle cx="835" cy="718" r="8" fill="#0d3b31"/>

    <text data-logo="slogan"
          x="600" y="730"
          text-anchor="middle"
          fill="#17251f"
          font-family="Arial, Helvetica, sans-serif"
          font-size="30"
          font-weight="700"
          letter-spacing="7"
          textLength="450"
          lengthAdjust="spacingAndGlyphs">YOUR SLOGAN HERE</text>
  </g>

  <!-- =========================
       ESTABLISHED + BEAN MEDALLION
       ========================= -->
  <g id="established">
    <path d="M300 810 Q420 770 490 810" fill="none"
          stroke="url(#gold)" stroke-width="5"/>
    <path d="M710 810 Q780 770 900 810" fill="none"
          stroke="url(#gold)" stroke-width="5"/>

    <text x="375" y="840" text-anchor="middle"
          fill="#f8e7b1" font-family="Georgia, serif"
          font-size="31" font-weight="700" letter-spacing="4">EST.</text>

    <text data-logo="year" x="825" y="840" text-anchor="middle"
          fill="#f8e7b1" font-family="Georgia, serif"
          font-size="31" font-weight="700" letter-spacing="4">2026</text>

    <!-- center medallion -->
    <circle cx="600" cy="815" r="70" fill="#09251f"
            stroke="url(#gold)" stroke-width="9"/>
    <circle cx="600" cy="815" r="56" fill="#32180c"
            stroke="#f2d991" stroke-width="3"/>
    <use href="#bean" transform="translate(600 805) rotate(25) scale(1.35)"/>
    <use href="#bean" transform="translate(600 833) rotate(-25) scale(1.35)"/>
  </g>

  <!-- =========================
       BOTTOM ORNAMENT
       ========================= -->
  <g id="bottomOrnament" data-logo="accent">
    <path d="M300 895 Q380 850 450 900" fill="none"
          stroke="url(#gold)" stroke-width="7"/>
    <path d="M900 895 Q820 850 750 900" fill="none"
          stroke="url(#gold)" stroke-width="7"/>

    <use href="#leafShape" transform="translate(345 885) rotate(175) scale(.75)"/>
    <use href="#leafShape" transform="translate(855 885) rotate(5) scale(.75)"/>

    <!-- stars -->
    <g fill="url(#gold)" stroke="#6b480d" stroke-width="2">
      <path d="M480 930 l8 22 24 1-19 15 6 24-19-13-20 13 7-24-20-15 24-1z"/>
      <path d="M550 955 l11 29 31 1-24 19 8 30-26-17-27 17 9-30-24-19 31-1z"/>
      <path d="M600 940 l13 34 36 1-28 22 10 35-31-20-31 20 10-35-28-22 36-1z"/>
      <path d="M650 955 l11 29 31 1-24 19 8 30-26-17-27 17 9-30-24-19 31-1z"/>
      <path d="M720 930 l8 22 24 1-19 15 6 24-19-13-20 13 7-24-20-15 24-1z"/>
    </g>
  </g>

  <!-- Template color anchors for Logo Engine V2 -->
  <g id="logo-engine-v2" opacity="0" pointer-events="none">
    <rect data-logo="primaryColor" x="0" y="0" width="1" height="1" fill="#0b2d26"/>
    <rect data-logo="accentColor" x="0" y="0" width="1" height="1" fill="#d4af37"/>
    <rect data-logo="textColor" x="0" y="0" width="1" height="1" fill="#fff8dc"/>
  </g>
</svg>
